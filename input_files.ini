[Input]
BaseDir=data\input
FileNames=screwdriver

[Run]
; 0 = beam search, 1 = global, 2 = local, 3 = global initialized from local
; 4 = global with multiple random feasible initial labelings
; 5 = local with multiple random feasible initial labelings
SubtractiveDecompositionMode=4
SubtractiveDecompositionHeight=5
SubtractiveRandomRestartCount=50
SubtractiveRandomSeed=2526
; 0 = automatic (up to 4), positive values explicitly set the worker count
SubtractiveRandomThreadCount=0
; Extra pairwise cost per unit length when a graph-cut boundary overlaps an additive-block boundary.
; 0 disables this term.
SubtractiveBlockBoundaryOverlapCostPerUnit=50
